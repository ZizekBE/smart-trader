[project]
name = "smart-trader"
version = "0.1.0"
description = "AI-powered trading engine for centralized exchanges"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Data & storage
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.0",
    "pandas>=2.2",
    "numpy>=1.26",
    # Exchange connectivity
    "ccxt>=4.2",
    "websockets>=12.0",
    # ML / RL
    "torch>=2.2",
    "gymnasium>=1.0",
    # Config & logging
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    # API server
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Optimisation (backtest / sleeve tuning)
    "optuna>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[project.scripts]
trader = "smart_trader.core.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_trader"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=smart_trader --cov-report=term-missing"
