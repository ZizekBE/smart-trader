global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "trader-python"
    static_configs:
      - targets: ["trader-python:9100"]

  - job_name: "trader-rust"
    static_configs:
      - targets: ["trader-rust:8080"]

  - job_name: "timescaledb"
    static_configs:
      - targets: ["timescaledb:9187"]   # postgres_exporter sidecar

  - job_name: "redis"
    static_configs:
      - targets: ["redis:9121"]         # redis_exporter sidecar
